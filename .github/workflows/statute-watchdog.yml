name: Oregon Statutes & Court Rules Watchdog

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC (Free on GitHub Actions)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-statutory-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Oregon Statutes Watchdog
        run: |
          npx tsx scripts/syncOregonStatutes.ts
